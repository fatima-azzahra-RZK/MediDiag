<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MédiDiag - Historique</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:#0d9488; --teal-light:#14b8a6; --teal-dark:#0f766e;
    --navy:#0f172a; --text:#e2e8f0; --text-muted:#94a3b8;
    --card-bg:rgba(30,41,59,0.85); --glass-border:rgba(20,184,166,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Outfit',sans-serif; background:linear-gradient(135deg,#0f172a,#1e293b); min-height:100vh; color:var(--text); }
  .bg-fixed { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 15% 40%, rgba(13,148,136,0.08) 0%, transparent 50%); }
  nav { position:sticky; top:0; z-index:100; background:rgba(15,23,42,0.9); backdrop-filter:blur(20px); border-bottom:1px solid rgba(20,184,166,0.1); padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between; }
  .nav-brand { display:flex; align-items:center; gap:10px; }
  .nav-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--teal-dark),var(--teal-light)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; }
  .nav-title { font-family:'DM Serif Display',serif; font-size:20px; }
  .nav-right { display:flex; gap:8px; }
  .nav-btn { padding:8px 14px; border-radius:10px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); color:var(--text-muted); font-family:'Outfit',sans-serif; font-size:13px; cursor:pointer; transition:all 0.2s; text-decoration:none; display:flex; align-items:center; gap:6px; }
  .nav-btn:hover { background:rgba(13,148,136,0.15); border-color:var(--teal); color:var(--teal-light); }
  .nav-btn.danger:hover { background:rgba(248,113,113,0.1); border-color:#f87171; color:#f87171; }
  
  main { max-width:1000px; margin:0 auto; padding:32px 24px; position:relative; z-index:1; }
  .page-header { margin-bottom:28px; }
  .page-header h1 { font-family:'DM Serif Display',serif; font-size:30px; margin-bottom:4px; }
  .page-header p { color:var(--text-muted); font-size:14px; }
  
  /* STATS */
  .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:28px; }
  .stat-card { background:var(--card-bg); border:1px solid var(--glass-border); border-radius:16px; padding:18px 22px; }
  .stat-value { font-size:28px; font-weight:700; color:var(--teal-light); margin-bottom:4px; }
  .stat-label { font-size:12px; color:var(--text-muted); }
  
  /* HISTORY LIST */
  .history-list { display:flex; flex-direction:column; gap:12px; }
  .history-item {
    background:var(--card-bg); border:1px solid rgba(255,255,255,0.06);
    border-radius:16px; padding:20px 24px;
    display:flex; align-items:flex-start; gap:16px;
    transition:all 0.2s; cursor:pointer;
  }
  .history-item:hover { border-color:rgba(20,184,166,0.3); transform:translateY(-1px); box-shadow:0 8px 30px rgba(0,0,0,0.3); }
  .history-date-col { min-width:100px; text-align:center; }
  .history-day { font-size:22px; font-weight:700; color:var(--teal-light); }
  .history-month { font-size:11px; color:var(--text-muted); }
  .history-content { flex:1; }
  .history-top { display:flex; align-items:center; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
  .history-disease { font-size:15px; font-weight:600; color:var(--text); }
  .urgency-badge { padding:3px 10px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge-critical { background:rgba(248,113,113,0.15); color:#fca5a5; }
  .badge-high { background:rgba(251,146,60,0.15); color:#fdba74; }
  .badge-medium { background:rgba(250,204,21,0.15); color:#fde047; }
  .badge-low { background:rgba(52,211,153,0.15); color:#6ee7b7; }
  .history-meta { font-size:12px; color:var(--text-muted); display:flex; gap:16px; flex-wrap:wrap; }
  .history-meta span { display:flex; align-items:center; gap:4px; }
  .history-actions { display:flex; gap:8px; }
  .btn-sm { padding:6px 12px; border-radius:8px; font-family:'Outfit',sans-serif; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.2s; border:none; }
  .btn-view { background:rgba(13,148,136,0.15); color:var(--teal-light); }
  .btn-view:hover { background:rgba(13,148,136,0.3); }
  .btn-del { background:rgba(248,113,113,0.1); color:#fca5a5; }
  .btn-del:hover { background:rgba(248,113,113,0.2); }
  
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-muted); }
  .empty-icon { font-size:56px; margin-bottom:16px; }
  .empty-state h3 { font-size:18px; color:var(--text); margin-bottom:8px; }
  .btn-primary { padding:13px 28px; border-radius:12px; background:linear-gradient(135deg,var(--teal-dark),var(--teal-light)); color:white; font-family:'Outfit',sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:all 0.2s; border:none; box-shadow:0 4px 20px rgba(13,148,136,0.35); margin-top:16px; }
  .btn-primary:hover { transform:translateY(-1px); box-shadow:0 6px 25px rgba(13,148,136,0.5); }
  
  .loading { text-align:center; padding:40px; color:var(--text-muted); }
  .spinner { display:inline-block; width:24px; height:24px; border:3px solid rgba(255,255,255,0.1); border-top-color:var(--teal); border-radius:50%; animation:spin 0.7s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body>
<div class="bg-fixed"></div>
 
<nav>
  <div class="nav-brand">
    <div class="nav-icon">🏥</div>
    <span class="nav-title">MédiDiag</span>
  </div>
  <div class="nav-right">
    <a href="form.html" class="nav-btn">📝 Nouvelle analyse</a>
    <a href="settings.html" class="nav-btn">⚙️ Paramètres</a>
    <button class="nav-btn danger" onclick="logout()">🚪 Déconnexion</button>
  </div>
</nav>
 
<main>
  <div class="page-header">
    <h1>Tableau de bord</h1>
    <p>Historique de vos analyses médicales</p>
  </div>
  
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-value" id="statTotal">--</div><div class="stat-label">Analyses effectuées</div></div>
    <div class="stat-card"><div class="stat-value" id="statBMI">--</div><div class="stat-label">Dernier IMC</div></div>
    <div class="stat-card"><div class="stat-value" id="statDisease">--</div><div class="stat-label">Dernière analyse</div></div>
  </div>
  
  <div id="historyContainer">
    <div class="loading"><div class="spinner"></div><p style="margin-top:12px">Chargement...</p></div>
  </div>
</main>
 
<script>
const API = 'http://127.0.0.1:5000/api';
const token = localStorage.getItem('token');
if (!token) window.location.href = 'login.html';
 
const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
const URGENCY_LABELS = { critical:'Urgence', high:'Attention', medium:'Surveillance', low:'Stable' };
 
async function loadHistory() {
  try {
    const res = await fetch(`${API}/history`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401) { window.location.href = 'login.html'; return; }
    const data = await res.json();
    renderHistory(data.history || []);
  } catch(e) {
    document.getElementById('historyContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p>Erreur de connexion au serveur.</p></div>`;
  }
}
 
function renderHistory(items) {
  // Stats
  document.getElementById('statTotal').textContent = items.length;
  if (items[0]) {
    document.getElementById('statBMI').textContent = items[0].bmi;
    document.getElementById('statDisease').textContent = items[0].results[0]?.name?.split(' ')[0] || '--';
  }
  
  if (!items.length) {
    document.getElementById('historyContainer').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <h3>Aucune analyse enregistrée</h3>
        <p>Commencez par remplir le formulaire médical pour obtenir votre première analyse</p>
        <button class="btn-primary" onclick="window.location.href='form.html'">📝 Faire une analyse</button>
      </div>`;
    return;
  }
  
  const html = items.map(item => {
    const d = new Date(item.date);
    const top = item.results[0] || {};
    return `
      <div class="history-item">
        <div class="history-date-col">
          <div class="history-day">${String(d.getDate()).padStart(2,'0')}</div>
          <div class="history-month">${MONTHS[d.getMonth()]} ${d.getFullYear()}</div>
          <div class="history-month">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}</div>
        </div>
        <div class="history-content">
          <div class="history-top">
            <span class="history-disease">${top.icon || '🏥'} ${top.name || 'Analyse'}</span>
            <span class="urgency-badge badge-${top.urgency || 'low'}">${URGENCY_LABELS[top.urgency] || 'Stable'}</span>
            <span style="font-size:13px;color:var(--teal-light);font-weight:600">${top.confidence || '--'}%</span>
          </div>
          <div class="history-meta">
            <span>📏 IMC: ${item.bmi}</span>
            <span>⚖️ ${item.data?.weight || '--'} kg</span>
            <span>📐 ${item.data?.height || '--'} cm</span>
            <span>🎂 ${item.data?.age || '--'} ans</span>
          </div>
        </div>
        <div class="history-actions">
          <button class="btn-sm btn-view" onclick="viewEntry('${item.id}')">👁 Voir</button>
          <button class="btn-sm btn-del" onclick="deleteEntry('${item.id}')">🗑</button>
        </div>
      </div>`;
  }).join('');
  
  document.getElementById('historyContainer').innerHTML = `<div class="history-list">${html}</div>`;
}
 
function viewEntry(id) {
  // Find in DOM data or re-fetch - simplified: store in session
  const items = JSON.parse(sessionStorage.getItem('historyItems') || '[]');
  const item = items.find(i => i.id === id);
  if (item) {
    localStorage.setItem('lastResult', JSON.stringify({ predictions: item.results, bmi: item.bmi }));
    window.location.href = 'result.html';
  }
}
 
async function deleteEntry(id) {
  if (!confirm('Supprimer cette entrée ?')) return;
  const res = await fetch(`${API}/history/${id}`, {
    method: 'DELETE',
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (res.ok) loadHistory();
}
 
function logout() {
  if (confirm('Se déconnecter ?')) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = 'login.html';
  }
}
 
// Patch viewEntry to use loaded data
const origLoad = loadHistory;
async function loadHistoryPatched() {
  try {
    const res = await fetch(`${API}/history`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (res.status === 401) { window.location.href = 'login.html'; return; }
    const data = await res.json();
    const items = data.history || [];
    sessionStorage.setItem('historyItems', JSON.stringify(items));
    renderHistory(items);
  } catch(e) {
    document.getElementById('historyContainer').innerHTML = `<div class="empty-state"><div class="empty-icon">❌</div><p>Erreur de connexion au serveur.</p></div>`;
  }
}
 
loadHistoryPatched();
</script>
</body>
</html>
